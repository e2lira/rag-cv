name: Verify database bootstrap

on:
  pull_request:
  push:
    branches: [main]

jobs:
  database-bootstrap:
    runs-on: ubuntu-latest
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGDATABASE: rag_cv_ci
      PGUSER: postgres
      PGPASSWORD: postgres
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: rag_cv_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d rag_cv_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4
      - name: Apply bootstrap twice
        run: |
          psql -v ON_ERROR_STOP=1 -f infra/sql/001_initialize_rag_cv.sql
          psql -v ON_ERROR_STOP=1 -f infra/sql/001_initialize_rag_cv.sql
      - name: Verify bootstrap contract
        run: psql -v ON_ERROR_STOP=1 -f infra/sql/tests/001_initialize_rag_cv_verify.sql

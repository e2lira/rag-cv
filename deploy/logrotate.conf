# Rotacion de la bitacora del sondeo -- RFC-0019 §7, RFC-0020 CA-18.
#
# Se instala en $RAG_CV_HOME/logs/logrotate.conf, propiedad del operador, y la
# invoca el crontab del USUARIO con su propio fichero de estado:
#
#   0 4 * * * /usr/sbin/logrotate --state $RAG_CV_HOME/logs/.logrotate.state \
#     $RAG_CV_HOME/logs/logrotate.conf
#
# **En espacio de usuario, no en el directorio del sistema.** RFC-0019 §7 lo
# dice literal, y no es preferencia: la rotacion del sistema exigiria root, y
# el sondeo entero existe para correr SIN privilegios (RFC-0016 §8.1). El
# fichero de estado propio es lo que lo hace posible: sin `--state`, logrotate
# escribe en /var/lib y necesita permisos que esta cuenta no tiene.
#
# Sin rotacion, un fallo repetido cada 5 minutos llena el disco y tumba el
# propio sondeo que debia vigilar. El sintoma no es "falta el log": es que
# PostgreSQL deja de poder escribir, lejos de la causa.
#
# No hace falta `create` ni `su`: el fichero, el directorio y el proceso que
# rota son todos del mismo usuario. Esas directivas existen para cuando root
# rota ficheros ajenos, que es justo lo que aqui no ocurre.

/opt/rag-cv/logs/*.log {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
}

# Fragmento de nginx para reto.qrimapp.com -- RFC-0020 §7.1
#
# CONTEXTO QUE HAY QUE LEER ANTES DE INSTALARLO
#
# El VPS YA tiene nginx sirviendo, gestionado por el panel de Hostinger, con
# TLS ya emitido para este dominio. **No hay paso de emision de certificado**
# y **no se instala Caddy**: un segundo terminador TLS competiria por los
# puertos 80 y 443 y simplemente no arrancaria.
#
# **No se edita a mano el vhost que genera el panel.** Un cambio del panel lo
# sobrescribe y el servicio vuelve al comportamiento anterior sin avisar. Se
# usa el mecanismo de fragmento personalizado que el panel ofrezca; si no
# ofrece ninguno, se documenta el fichero exacto y se verifica tras cada
# actualizacion del panel (CA-14).
#
# La aplicacion NO es un sitio estatico: la raiz de documentos
# (/home/qrimapp-reto/htdocs/reto.qrimapp.com) no sirve para publicarla.
# Queda para el desafio ACME o sin uso.

# ---------------------------------------------------------------------------
# El flujo de eventos. ESTE BLOQUE VA ANTES QUE EL GENERICO.
# ---------------------------------------------------------------------------
#
# nginx bufferea las respuestas proxied POR DEFECTO. Con `proxy_buffering`
# activo el cliente no recibe nada hasta que nginx vacia el bufer: el
# endpoint sigue respondiendo, las pruebas de contrato de eventos siguen
# pasando, y **la latencia de primer token se convierte en la de respuesta
# completa**. RNF-1 (primer token p95 <= 2 s) se cae sin un solo error en los
# registros. Es el fallo silencioso de esta capa.
#
# La ubicacion es una EXPRESION REGULAR y no una ruta literal a proposito.
# Antes era `location /v1/chat/stream`, escrito cuando ese era el unico
# endpoint que transmitia. RFC-0005 §13 agrego `/v1/responses`, que con
# `"stream": true` tambien responde `text/event-stream` -- y es el endpoint
# que registra la plataforma de agentes externa, o sea justo el que no puede
# permitirse el bufer. Con la ruta literal caia en la ubicacion generica, con
# el bufer activo (CA-19).
#
# `/v1/responses` sin `stream` responde JSON normal; que pase por aqui no le
# hace dano -- `proxy_buffering off` sobre una respuesta corta no cambia nada
# observable -- y evita enrutar por cuerpo de peticion, que nginx no puede
# hacer.
location ~ ^/v1/(chat/stream|responses)$ {
    proxy_pass http://127.0.0.1:8080;

    proxy_http_version 1.1;
    proxy_set_header Connection "";

    proxy_buffering off;          # sin esto no hay streaming, solo la ilusion
    proxy_cache off;
    gzip off;                     # comprimir tambien bufferea
    proxy_read_timeout 300s;      # el defecto de 60s corta respuestas largas

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# ---------------------------------------------------------------------------
# El resto de la API y las sondas.
# ---------------------------------------------------------------------------
location ~ ^/(v1/|healthz$|readyz$) {
    proxy_pass http://127.0.0.1:8080;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_read_timeout 120s;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
